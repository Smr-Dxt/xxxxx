name: Coverage Gate

on:
  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage and enforce threshold
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=85 -q

      - name: Publish coverage summary
        if: always()
        run: |
          echo "Coverage check passed or failed based on the threshold above."
